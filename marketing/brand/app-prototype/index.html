<title>I am (IN) App Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-sized prototype on the left, section list + controls on the right; full-screen prototype on phones. */
:root{
  --bg:#F2F1EC; --s1:#FFFFFF; --s2:#E8E7E1; --s3:#DCDBD4; --ink:#0B0B0A; --mute:#6E6D67; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.15);
  --p:#7C3BED; --pt:#7C3BED; --pSoft:rgba(124,59,237,.12); --page:#E2E0D9; --cream:#F6F1E4; --creamInk:#17140F; --hero:#0B0B0A; --heroInk:#F4F3EE;
  --nav:rgba(255,255,255,.92); --sheet:#FFFFFF; --scrim:rgba(0,0,0,.35);
  --ui:'Space Grotesk',system-ui,sans-serif; --dsp:'Anton','Impact','Arial Narrow',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0B0A;--s1:#171716;--s2:#242422;--s3:#2F2F2C;--ink:#F4F3EE;--mute:#8F8E88;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);--pt:#B49BFF;--pSoft:rgba(124,59,237,.22);--page:#121110;--cream:#1E1B16;--creamInk:#F3EBDB;--hero:#171716;--nav:rgba(28,28,26,.92);--sheet:#151514;--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0A;--s1:#171716;--s2:#242422;--s3:#2F2F2C;--ink:#F4F3EE;--mute:#8F8E88;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);--pt:#B49BFF;--pSoft:rgba(124,59,237,.22);--page:#121110;--cream:#1E1B16;--creamInk:#F3EBDB;--hero:#171716;--nav:rgba(28,28,26,.92);--sheet:#151514;--scrim:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
input{font:inherit;color:inherit}
.wrap{min-height:100%;display:flex;gap:48px;align-items:center;justify-content:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{width:390px;height:844px;border-radius:50px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 10px #111,0 30px 70px rgba(0,0,0,.35);flex:none;user-select:none;-webkit-user-select:none}
#app{position:absolute;inset:0}
.panel{width:360px;flex:none;display:flex;flex-direction:column;gap:16px;min-width:0;max-height:844px}
.panel h1{font:400 44px/0.95 var(--dsp);text-transform:uppercase;letter-spacing:.01em;margin:0}
.panel p{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl label{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.pseg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.pseg button{flex:1;height:34px;border-radius:999px;font-weight:600;font-size:13px;color:var(--mute)}
.pseg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.jump{display:flex;flex-direction:column;gap:1px;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:6px;min-height:0;flex:1}
.jump h3{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:10px 10px 4px}
.jump h3:first-child{margin-top:4px}
.jump button{display:flex;align-items:center;gap:8px;text-align:left;padding:7px 10px;border-radius:10px;font-size:13.5px;font-weight:500}
.jump button[aria-current="true"]{background:var(--pSoft);color:var(--pt);font-weight:700}
.tag{margin-left:auto;font:500 9.5px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 6px;border-radius:5px;background:var(--s2);color:var(--mute);white-space:nowrap}
.tag.new{background:var(--p);color:#fff}.tag.upd{background:var(--pSoft);color:var(--pt)}.tag.nat{background:var(--ink);color:var(--bg)}
.plink{font-weight:600;font-size:13.5px;color:var(--pt);text-decoration:none}
@media (max-width:840px){
  .wrap{display:block;padding:0}
  .device{width:100%;height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:640px;border-radius:0;box-shadow:none}
  .panel{width:auto;max-height:none;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .jump{max-height:none}
}

/* ---------- app ---------- */
.scr{position:absolute;inset:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;animation:scrIn .22s ease-out both}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:120px;min-height:0}
.scroll::-webkit-scrollbar{display:none}
.status{height:calc(46px + env(safe-area-inset-top,0px));padding:calc(10px + env(safe-area-inset-top,0px)) 28px 0 32px;display:flex;justify-content:space-between;align-items:center;font:600 15px var(--ui);flex:none}
.hdr{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 20px;flex:none}
.logo{font:700 18px var(--ui);letter-spacing:.04em;line-height:1;white-space:nowrap}
.logo i{font-style:normal;color:var(--p)}
.hic{display:flex;gap:2px}
.icb{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
.icb.f{background:var(--s2)}
.badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--p);color:#fff;font:700 10px var(--ui);display:flex;align-items:center;justify-content:center;padding:0 4px}
.ic{display:inline-block;vertical-align:middle;flex:none}
.dsp{font-family:var(--dsp);text-transform:uppercase;line-height:.92;letter-spacing:.005em}
.meta{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.mute{color:var(--mute)}
.pill{height:42px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:14.5px;padding:0 18px;white-space:nowrap}
.pg{background:var(--s2);color:var(--ink)}
.pp{background:var(--p);color:#fff}
.po{border:1.5px solid var(--line2)}
.ppt{background:var(--pSoft);color:var(--pt)}
.av{border-radius:50%;object-fit:cover;flex:none;display:block}
.avs{display:flex}.avs .av{border:2px solid var(--s1);margin-left:-8px}.avs .av:first-child{margin-left:0}
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1}
.h2{display:flex;align-items:center;justify-content:space-between;padding:22px 20px 10px}
.st{display:inline-block;overflow:visible;flex:none;vertical-align:middle;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28))}
.slap{animation:slap .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes slap{0%{transform:scale(.2) rotate(calc(var(--r,0deg) + 26deg));opacity:0}60%{transform:scale(1.12) rotate(calc(var(--r,0deg) - 4deg));opacity:1}100%{transform:scale(1) rotate(var(--r,0deg))}}
.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
.nav{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:66px;border-radius:999px;background:var(--nav);border:1px solid var(--line2);display:flex;align-items:center;justify-content:space-around;z-index:40;box-shadow:0 10px 30px rgba(0,0,0,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:600;color:var(--mute);width:58px}
.nav button[aria-current="page"]{color:var(--pt)}
.nav .add{margin-top:-30px}
.nav .add b{width:54px;height:54px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(124,59,237,.45);border:4px solid var(--bg)}
.fade{position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(to bottom,transparent,var(--bg) 70%);z-index:35;pointer-events:none}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:999px;font-size:14px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--ink)}
.seg.p button[aria-pressed="true"]{background:var(--p);color:#fff}
.tog{width:44px;height:26px;border-radius:999px;background:var(--p);position:relative;flex:none;display:inline-block}
.tog::after{content:"";position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:all .2s}
.tog[aria-pressed="false"]{background:var(--s3)}.tog[aria-pressed="false"]::after{right:21px}
/* sheets */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:60;animation:fadeIn .2s both}
@keyframes fadeIn{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sheet);border-radius:30px 30px 0 0;z-index:61;max-height:92%;display:flex;flex-direction:column;animation:up .32s cubic-bezier(.2,.9,.3,1) both;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line2);margin:10px auto 6px;flex:none}
.sheet .sbody{overflow:auto;padding:4px 20px 24px;scrollbar-width:none}
.toast{position:absolute;left:20px;right:20px;bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:16px;padding:13px 16px;font-size:14px;z-index:90;animation:pop .25s both}
.lrow{background:var(--s1);border:1px solid var(--line);border-radius:20px;min-height:68px;display:flex;align-items:center;padding:11px 14px;gap:12px}
.thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none}
.tt{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mute);margin-top:2px;display:flex;align-items:center;gap:6px}
.react{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px 0 4px;border-radius:999px;background:var(--s1);border:1.5px solid var(--line);font:700 14px var(--ui)}
.react.on{background:#FFE3F0;border-color:#FF5FA8;color:#0B0B0A}
.field{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:16px;padding:0 14px;min-height:52px}
.field input{flex:1;min-width:0;border:0;background:none;font:600 16px var(--ui);outline:none;height:50px}
.flab{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
@media (prefers-reduced-motion: reduce){#app *,#app *::before{animation-duration:.01ms!important;animation-delay:0ms!important;transition:none!important}}
</style>
<div class="wrap">
  <div class="device" id="device"><div id="app"></div></div>
  <aside class="panel" aria-label="Prototype controls">
    <h1>App prototype</h1>
    <p>Tap through it like the app. Every section and its sheets are listed below; tags show what exists today, what only gets a new look, and what is a new feature.</p>
    <div class="ctl"><label>Theme</label><div class="pseg" id="themeSeg"><button data-v="system" aria-pressed="true">Phone</button><button data-v="light" aria-pressed="false">Light</button><button data-v="dark" aria-pressed="false">Dark</button></div></div>
    <a class="plink" href="https://claude.ai/artifact/P7FtvPMCRBhRJ4TQUKUpuE" target="_blank" rel="noopener">Open the onboarding prototype ↗</a>
    <div class="jump" id="jump"></div>
  </aside>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
// I am (IN) sticker set. Each sticker is drawn in a 0..100 box; the white die-cut
// outline comes from the #cut filter, so shapes need no outline of their own.
const K = "#0B0B0A", LIME = "#D8FF3D", PINK = "#FF5FA8", ORANGE = "#FF6A13", YEL = "#FFE14D",
  GOLD = "#FFD400", BLUE = "#3B6CFF", RED = "#F23D3D", CREAM = "#FBF7EC";

const DEFS = `
<filter id="cut" filterUnits="userSpaceOnUse" x="-12" y="-12" width="124" height="124">
 <feMorphology in="SourceAlpha" operator="dilate" radius="4.2" result="d"/>
 <feGaussianBlur in="d" stdDeviation="1.4" result="b"/>
 <feComponentTransfer in="b" result="t"><feFuncA type="linear" slope="7" intercept="-2.5"/></feComponentTransfer>
 <feFlood flood-color="#fff"/><feComposite in2="t" operator="in" result="w"/>
 <feMerge><feMergeNode in="w"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<radialGradient id="silver" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#c9c9c9"/><stop offset="1" stop-color="#5d5d5d"/></radialGradient>
<linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset=".5" stop-color="#E9B23A"/><stop offset="1" stop-color="#B57E12"/></linearGradient>
<clipPath id="discoclip"><circle cx="50" cy="56" r="34"/></clipPath>
<clipPath id="ballclip"><circle cx="50" cy="50" r="38"/></clipPath>
<clipPath id="popclip"><path d="M14 88 L40 38 L64 62 Z"/></clipPath>`;

const burstPath = (cx, cy, r1, r2, n) => {
  let d = "";
  for (let i = 0; i < n * 2; i++) {
    const a = (Math.PI * i) / n - Math.PI / 2, r = i % 2 ? r2 : r1;
    d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1);
  }
  return d + "Z";
};
const wavyCircle = (cx, cy, r, amp, n) => {
  let d = "";
  for (let i = 0; i <= 72; i++) {
    const a = (Math.PI * 2 * i) / 72, rr = r + amp * Math.sin(n * a);
    d += (i ? "L" : "M") + (cx + rr * Math.cos(a)).toFixed(1) + " " + (cy + rr * Math.sin(a)).toFixed(1);
  }
  return d + "Z";
};
const sunRays = () => {
  let s = "";
  for (let i = 0; i < 12; i++) {
    const a = (Math.PI * 2 * i) / 12, b = 0.17;
    const p = (r, t) => `${(50 + r * Math.cos(t)).toFixed(1)} ${(50 + r * Math.sin(t)).toFixed(1)}`;
    s += `<path d="M${p(28, a - b)} L${p(45, a)} L${p(28, a + b)}Z" fill="#FF9F1C"/>`;
  }
  return s;
};
const ballPatches = () => {
  let s = "";
  for (let k = 0; k < 5; k++) {
    const a = -Math.PI / 2 + (k * 2 * Math.PI) / 5, cx = 50 + 33 * Math.cos(a), cy = 50 + 33 * Math.sin(a);
    s += `<path d="${burstPath(cx, cy, 11, 11, 5).replace(/L/g, " L")}" fill="${K}" transform="rotate(${(k * 72 + 180).toFixed(0)} ${cx.toFixed(1)} ${cy.toFixed(1)})"/>`;
    const ix = 50 + 12 * Math.cos(a), iy = 50 + 12 * Math.sin(a), ox = 50 + 23 * Math.cos(a), oy = 50 + 23 * Math.sin(a);
    s += `<path d="M${ix.toFixed(1)} ${iy.toFixed(1)} L${ox.toFixed(1)} ${oy.toFixed(1)}" stroke="${K}" stroke-width="2.4"/>`;
  }
  return s;
};
const pent = (cx, cy, r) => { let d = ""; for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5; d += (i ? "L" : "M") + (cx + r * Math.cos(a)).toFixed(1) + " " + (cy + r * Math.sin(a)).toFixed(1); } return d + "Z"; };

const T = (txt, x, y, size, fill = K, fam = "Anton", extra = "") =>
  `<text x="${x}" y="${y}" text-anchor="middle" font-family="${fam}" font-size="${size}" fill="${fill}" ${extra}>${txt}</text>`;

const S = {
in: `<circle cx="50" cy="50" r="42" fill="${LIME}"/>${T("I'M IN", 50, 62, 33, K, "Anton", 'transform="rotate(-12 50 50)"')}`,
free: `<g transform="rotate(-6 50 50)"><rect x="6" y="30" width="88" height="40" rx="20" fill="${LIME}"/><circle cx="25" cy="50" r="8" fill="#17B75A"/><circle cx="25" cy="50" r="3.5" fill="#B9F5CF"/>${T("FREE", 61, 61, 28)}</g>`,
spritz: `<path d="M26 18h48c0 30-8 44-24 46C34 62 26 48 26 18z" fill="#EAF3F5" stroke="#B9CFD3" stroke-width="1.5"/><path d="M29 30h42c-2 20-9 30-21 31-12-1-19-11-21-31z" fill="${ORANGE}"/><path d="M29 30h42" stroke="#FFD9B8" stroke-width="3"/><rect x="47" y="63" width="6" height="21" fill="#EAF3F5" stroke="#B9CFD3" stroke-width="1.5"/><ellipse cx="50" cy="86" rx="17" ry="5" fill="#EAF3F5" stroke="#B9CFD3" stroke-width="1.5"/><circle cx="72" cy="20" r="11" fill="#FFB21F"/><circle cx="72" cy="20" r="7.5" fill="#FFD36B"/><path d="M72 13v14M65 20h14M67 15l10 10M77 15l-10 10" stroke="#FFB21F" stroke-width="1.4"/><path d="M38 8l10 48" stroke="${K}" stroke-width="3" stroke-linecap="round"/><circle cx="41" cy="44" r="2" fill="#fff" opacity=".7"/><circle cx="56" cy="38" r="1.6" fill="#fff" opacity=".7"/>`,
disco: `<rect x="48.5" y="6" width="3" height="16" fill="#8a8a8a"/><circle cx="50" cy="56" r="34" fill="url(#silver)"/><g clip-path="url(#discoclip)" stroke="rgba(0,0,0,.28)" stroke-width="1.6" fill="none"><path d="M10 34h80M10 43h80M10 52h80M10 61h80M10 70h80M10 79h80"/><ellipse cx="50" cy="56" rx="11" ry="34"/><ellipse cx="50" cy="56" rx="23" ry="34"/><path d="M50 20v74"/></g><rect x="30" y="37" width="8" height="7" fill="#fff" opacity=".9"/><rect x="40" y="46" width="6" height="6" fill="#fff" opacity=".6"/><path d="M80 14l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="${LIME}"/>`,
sneaker: `<path d="M12 64 C12 50 18 38 28 34 L42 32 C46 42 56 48 68 50 C82 52 90 56 90 66 Z" fill="${PINK}"/><path d="M30 34 C34 44 34 54 30 64" stroke="#fff" stroke-width="3" fill="none"/><path d="M44 36l-6 6M50 40l-6 6M56 43l-6 6" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M58 58 C66 52 76 54 84 60" stroke="${LIME}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M10 64 H92 C92 72 88 78 82 78 H18 C12 78 10 72 10 64Z" fill="${CREAM}"/><path d="M10 70 H92" stroke="${K}" stroke-width="2.5"/>`,
couch: `<rect x="22" y="28" width="56" height="30" rx="9" fill="#2F5BE6"/><rect x="16" y="50" width="68" height="22" rx="7" fill="${BLUE}"/><rect x="8" y="40" width="18" height="36" rx="9" fill="#5A84FF"/><rect x="74" y="40" width="18" height="36" rx="9" fill="#5A84FF"/><rect x="16" y="76" width="7" height="10" rx="2" fill="#1b2f7a"/><rect x="77" y="76" width="7" height="10" rx="2" fill="#1b2f7a"/><path d="M50 52v18" stroke="#2848c4" stroke-width="2"/><rect x="30" y="34" width="16" height="13" rx="4" fill="${LIME}" transform="rotate(-8 38 40)"/>`,
sun: `${sunRays()}<circle cx="50" cy="50" r="27" fill="${YEL}"/><rect x="31" y="42" width="16" height="11" rx="5" fill="${K}"/><rect x="53" y="42" width="16" height="11" rx="5" fill="${K}"/><path d="M47 45h6" stroke="${K}" stroke-width="2.5"/>`,
ball: `<circle cx="50" cy="50" r="38" fill="#fff" stroke="${K}" stroke-width="2.5"/><g clip-path="url(#ballclip)">${ballPatches()}</g><path d="${pent(50, 50, 12)}" fill="${K}"/><circle cx="50" cy="50" r="38" fill="none" stroke="${K}" stroke-width="2.5"/>`,

const SCREENS = {}; const SHEETS = {};
const app = document.getElementById('app');
function go(id, params = {}) {

  state.screen = id; state.params = params;
  const s = SCREENS[id];
  app.innerHTML = `<div class="scr" id="scr">${s.render(params)}</div>`;
  s.mount && s.mount(app.querySelector('#scr'), params);
  updatePanel();
}
function openSheet(id, params = {}) {
  const sh = SHEETS[id]; if (!sh) return;
  closeSheet();
  const wrap = document.createElement('div'); wrap.id = 'sheetwrap';
  wrap.innerHTML = `<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-label="${esc(sh.label)}" style="${sh.full ? 'max-height:none;top:calc(40px + env(safe-area-inset-top,0px))' : ''}"><div class="grab"></div><div class="sbody">${sh.render(params)}</div></div>`;
  app.appendChild(wrap);
  sh.mount && sh.mount(wrap, params);
  state.sheet = id; updatePanel();
}
function closeSheet() { const w = document.getElementById('sheetwrap'); if (w) w.remove(); state.sheet = null; updatePanel(); }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; app.appendChild(t); setTimeout(() => t.remove(), 2200); }

app.addEventListener('click', (e) => {
  const c = e.target.closest('[data-close]'); if (c) { closeSheet(); return; }

  const sh = e.target.closest('[data-sheet]'); if (sh) { openSheet(sh.dataset.sheet, sh.dataset.p ? JSON.parse(sh.dataset.p) : {}); return; }
  const t = e.target.closest('[data-toast]'); if (t) { toast(t.dataset.toast); return; }

  const tg = e.target.closest('.tog'); if (tg) { tg.setAttribute('aria-pressed', tg.getAttribute('aria-pressed') === 'false'); return; }

});

function updatePanel() {

}
