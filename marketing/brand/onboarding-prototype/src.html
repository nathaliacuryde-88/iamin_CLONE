<title>I am (IN) Onboarding</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-sized prototype on the left, a control panel on the right; full-screen prototype on phones. */
:root{
  --bg:#F2F1EC; --s1:#FFFFFF; --s2:#E8E7E1; --s3:#DCDBD4; --ink:#0B0B0A; --mute:#6E6D67; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.15);
  --p:#7C3BED; --pt:#7C3BED; --pSoft:rgba(124,59,237,.12); --page:#E2E0D9; --panel:#F7F6F2;
  --ui:'Space Grotesk',system-ui,sans-serif; --dsp:'Anton','Impact','Arial Narrow',sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B0B0A;--s1:#171716;--s2:#242422;--s3:#2F2F2C;--ink:#F4F3EE;--mute:#8F8E88;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);--pt:#B49BFF;--pSoft:rgba(124,59,237,.22);--page:#121110;--panel:#191817;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0A;--s1:#171716;--s2:#242422;--s3:#2F2F2C;--ink:#F4F3EE;--mute:#8F8E88;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.17);--pt:#B49BFF;--pSoft:rgba(124,59,237,.22);--page:#121110;--panel:#191817;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--pt);outline-offset:2px}
.wrap{min-height:100%;display:flex;gap:48px;align-items:center;justify-content:center;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.device{width:390px;height:844px;border-radius:50px;overflow:hidden;position:relative;background:var(--bg);box-shadow:0 0 0 10px #111,0 30px 70px rgba(0,0,0,.35);flex:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:absolute;inset:0}
.panel{width:340px;flex:none;display:flex;flex-direction:column;gap:18px;min-width:0}
.panel h1{font:400 44px/0.95 var(--dsp);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.panel p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.5}
.ctl{display:flex;flex-direction:column;gap:8px}
.ctl label{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.seg{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;height:36px;border-radius:999px;font-weight:600;font-size:13.5px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.jump{display:flex;flex-direction:column;gap:2px;max-height:340px;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:6px}
.jump button{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px;border-radius:12px;font-size:13.5px;font-weight:500}
.jump button[aria-current="true"]{background:var(--pSoft);color:var(--pt);font-weight:700}
.jump .n{font:500 11px var(--mono);color:var(--mute);width:18px}
.tag{margin-left:auto;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.04em;padding:3px 7px;border-radius:6px;background:var(--s2);color:var(--mute);white-space:nowrap}
.tag.new{background:var(--p);color:#fff}
.tag.upd{background:var(--pSoft);color:var(--pt)}
.restart{height:44px;border-radius:999px;border:1.5px solid var(--line2);font-weight:600;font-size:14px}
.legend{font-size:12.5px;color:var(--mute);line-height:1.5}
@media (max-width:820px){
  .wrap{display:block;padding:0}
  .device{width:100%;height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:640px;border-radius:0;box-shadow:none}
  .panel{width:auto;padding:28px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
}

/* ---------- screens ---------- */
.scr{position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--ink);animation:scrIn .28s ease-out both}
@keyframes scrIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.scr.photo{background:#000;color:#fff}
.scr.purple{background:#7C3BED;color:#fff}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 7s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.05) 32%,rgba(0,0,0,.1) 52%,rgba(0,0,0,.85) 100%)}
.safe-top{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.bars{position:absolute;left:14px;right:14px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:4px;z-index:30}
.bars span{flex:1;height:3px;border-radius:2px;background:color-mix(in srgb,currentColor 28%,transparent);overflow:hidden}
.bars span i{display:block;height:100%;width:0;background:currentColor}
.bars span.done i{width:100%}
.bars span.on i{animation:fill var(--dur) linear forwards}
@keyframes fill{to{width:100%}}
.paused *{animation-play-state:paused!important}
.topline{position:absolute;left:18px;right:12px;top:calc(28px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;z-index:30}
.logo{font:700 17px var(--ui);letter-spacing:.04em;line-height:1}
.logo i{font-style:normal;color:var(--p)}
.photo .logo i,.purple .logo i{color:#C9B3FF}
.icb{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ic{display:inline-block;vertical-align:middle;flex:none}
.hl{font-family:var(--dsp);text-transform:uppercase;line-height:.9;letter-spacing:.005em;margin:0;text-wrap:balance}
.hl .w{display:inline-block;animation:wUp .6s cubic-bezier(.2,.9,.25,1.15) both;animation-delay:calc(var(--d,0ms) + var(--i) * 110ms)}
@keyframes wUp{from{transform:translateY(70%) rotate(5deg);opacity:0}to{transform:none;opacity:1}}
.hl .acc{background:var(--p);color:#fff;padding:0 .1em;margin:0 -.02em}
.sub{font-size:15.5px;line-height:1.45;animation:fadeUp .5s ease-out both;animation-delay:var(--d,900ms)}
.photo .sub{color:rgba(255,255,255,.86)}
.scr:not(.photo):not(.purple) .sub{color:var(--mute)}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.stk{position:absolute;display:block;animation:slap .55s cubic-bezier(.2,.9,.3,1.3) both}
.stk>span{display:block;animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--bd,0ms) + 600ms)}
.stk svg{display:block;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
@keyframes slap{0%{transform:scale(.2) rotate(calc(var(--r,0deg) + 28deg));opacity:0}55%{transform:scale(1.14) rotate(calc(var(--r,0deg) - 5deg));opacity:1}78%{transform:scale(.95) rotate(calc(var(--r,0deg) + 2deg))}100%{transform:scale(1) rotate(var(--r,0deg));opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:600;font-size:14px;white-space:nowrap}
.glass{background:rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;border:1px solid rgba(255,255,255,.22)}
.pin{position:absolute}
.pop{animation:popIn .45s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes popIn{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.slideR{animation:slideR .55s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes slideR{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
.tapzone{position:absolute;inset:0;z-index:20}
.btn{height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16.5px;width:100%}
.btn.p{background:var(--p);color:#fff;box-shadow:0 10px 26px rgba(124,59,237,.35)}
.btn.w{background:#fff;color:#7C3BED}
.btn.g{background:var(--s2);color:var(--ink)}
.btn.t{height:44px;color:var(--mute);font-weight:600;font-size:15px}
.purple .btn.t,.photo .btn.t{color:rgba(255,255,255,.85)}
.btn[disabled]{opacity:.45;cursor:default}
.mono{font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em;font-size:11.5px}

/* setup */
.setup{display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px))}
.shead{display:flex;align-items:center;gap:10px;height:44px}
.steps{flex:1;display:flex;gap:4px}
.steps span{flex:1;height:4px;border-radius:2px;background:var(--s3)}
.steps span.done{background:var(--p)}
.skip{font-weight:600;font-size:14px;color:var(--mute);padding:8px 4px}
.ill{position:relative;height:150px;margin-top:6px;flex:none}
.sbody{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-bottom:8px;scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.field{display:flex;align-items:center;gap:10px;background:var(--s1);border:1.5px solid var(--line);border-radius:18px;padding:0 16px;min-height:60px}
.field:focus-within{border-color:var(--p)}
.field input{flex:1;min-width:0;border:0;background:none;font:600 18px var(--ui);color:var(--ink);outline:none;height:58px}
.field input::placeholder{color:var(--mute);font-weight:500}
.field .pre{font:600 18px var(--ui);color:var(--mute)}
.flab{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:4px 2px -4px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px}
.row{display:flex;align-items:center;gap:12px}
.av{border-radius:50%;object-fit:cover;flex:none}
.tile{border-radius:20px;background:var(--s1);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:12.5px;height:96px;position:relative}
.tile[aria-pressed="true"]{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 8px 20px rgba(124,59,237,.35)}
.tile svg{overflow:visible;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.wheel{display:grid;grid-template-columns:1fr 1.6fr 1.2fr;gap:6px;position:relative;height:180px;align-items:center;background:var(--s1);border:1px solid var(--line);border-radius:22px;overflow:hidden;padding:0 12px}
.wheel .sel{position:absolute;left:10px;right:10px;top:68px;height:44px;border-radius:12px;background:var(--pSoft)}
.wheel div{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;font-size:16px;color:var(--mute);font-weight:500}
.wheel b{color:var(--ink);font-size:21px}
.follow{height:36px;border-radius:999px;padding:0 14px;font-weight:700;font-size:13.5px;background:var(--p);color:#fff;flex:none}
.follow[aria-pressed="true"]{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.newtag{font:500 9.5px var(--mono);text-transform:uppercase;padding:3px 6px;border-radius:5px;background:var(--p);color:#fff;letter-spacing:.04em}
.toast{position:absolute;left:20px;right:20px;bottom:110px;background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;font-size:14px;z-index:50;animation:fadeUp .3s ease-out both}
.notif{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:20px;background:var(--s1);border:1px solid var(--line);box-shadow:0 10px 26px rgba(0,0,0,.08)}
@media (prefers-reduced-motion: reduce){
  .scr *:not(.bars i),.scr{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}
}
</style>

<div class="wrap">
  <div class="device" id="device"><div id="stage"></div></div>
  <aside class="panel" aria-label="Prototype controls">
    <h1>Onboarding prototype</h1>
    <p>Stories first, then setup. On the stories tap the right side to go on, the left side to go back, and hold to pause. Setup steps wait for you.</p>
    <div class="ctl"><label>Path</label><div class="seg" id="pathSeg"><button data-v="person" aria-pressed="true">Person</button><button data-v="organizer" aria-pressed="false">Organizer</button></div></div>
    <div class="ctl"><label>Theme</label><div class="seg" id="themeSeg"><button data-v="system" aria-pressed="true">Phone</button><button data-v="light" aria-pressed="false">Light</button><button data-v="dark" aria-pressed="false">Dark</button></div></div>
    <div class="ctl"><label>Screens</label><div class="jump" id="jump"></div></div>
    <button class="restart" id="restart">Restart</button>
    <p class="legend"><b>Existing</b> = in the app today, new look. <b>New</b> = new step or feature. The cast photos are placeholders for real ones.</p>
  </aside>
</div>

<script>
(() => {
document.getElementById('defs').innerHTML = DEFS;
const IN_LIME = S.in;
S.in = S.in.replace('#D8FF3D', '#7C3BED').replace('fill="#0B0B0A"', 'fill="#fff"');
const A = (n) => `assets/${n}`;
const I = (n, s = 22, sw = 2) => `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${LUCIDE[n] || ''}</svg>`;
const SV = (n, s) => `<svg viewBox="-10 -10 120 120" width="${s * 1.2}" height="${s * 1.2}" style="margin:${-s * .1}px" aria-hidden="true"><g filter="url(#cut)">${S[n]}</g></svg>`;
// positioned, animated sticker
const st = (n, s, x, y, r = 0, d = 0, extra = '') => `<span class="stk" style="left:${x}px;top:${y}px;--r:${r}deg;animation-delay:${d}ms;--bd:${d}ms;${extra}"><span>${SV(n, s)}</span></span>`;
const words = (txt, d = 200) => txt.split(' ').map((w, i) => {
  const acc = w.startsWith('*'); const clean = w.replace(/\*/g, '');
  return `<span class="w${acc ? ' acc' : ''}" style="--i:${i};--d:${d}ms">${clean}</span>`;
}).join(' ');
const logo = `<span class="logo">I am <i>(</i>IN<i>)</i></span>`;

/* ---------------- screen definitions ---------------- */
const SCREENS = {
splash: { label: 'Logo intro', tag: 'new', auto: 2800, render: () => `<div class="scr" style="display:flex;align-items:center;justify-content:center">
  ${st('disco', 74, 40, 150, -10, 700)}${st('spritz', 70, 268, 120, 10, 820)}${st('cam', 76, 26, 560, -8, 940)}${st('popper', 70, 270, 590, 8, 1060)}${st('seal', 60, 160, 680, 0, 1180)}${st('hey', 66, 170, 70, -6, 1300)}
  <div style="font:700 50px var(--ui);letter-spacing:.04em;display:flex;align-items:center;gap:12px">
    <span class="pop" style="animation-delay:100ms">I am</span>
    <span style="display:flex;align-items:center"><i style="font-style:normal;color:var(--p);display:inline-block;animation:brL .5s cubic-bezier(.2,.9,.3,1.2) .35s both">(</i><span class="pop" style="animation-delay:520ms">IN</span><i style="font-style:normal;color:var(--p);display:inline-block;animation:brR .5s cubic-bezier(.2,.9,.3,1.2) .35s both">)</i></span>
  </div>
  <style>@keyframes brL{from{transform:translateX(-80px);opacity:0}to{transform:none;opacity:1}}@keyframes brR{from{transform:translateX(80px);opacity:0}to{transform:none;opacity:1}}</style>
</div>` },

choose: { label: 'Welcome — pick your path', tag: 'upd', render: () => `<div class="scr setup">

       ['organizer', 'fl_razzia.jpg', 'Hosting events', 'Organizer', ['Guest lists', 'Ticket payouts', 'Line Mode wait times', 'Host track record'], 'crown', 450]].map((o) => `<button class="pick pop" data-pick="${o[0]}" style="animation-delay:${o[6]}ms">

  .pickshade{position:absolute;inset:0;border-radius:26px;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.78))}

  .pickgo{position:absolute;right:14px;bottom:16px;width:40px;height:40px;border-radius:50%;background:#7C3BED;display:flex;align-items:center;justify-content:center}
  </style>
</div>` },

p1: { label: 'Your plans, in one place', tag: 'upd', story: 1, render: () => `<div class="scr" style="background:var(--bg)">

  </div>
  <div class="chip pop" style="position:absolute;left:30px;top:640px;height:36px;padding:0 14px;background:var(--s1);border:1px solid var(--line);animation-delay:2.7s">${I('Link', 16)}or paste a link</div>

</div>` },

p2: { label: "See who's in", tag: 'upd', story: 1, render: () => `<div class="scr photo">

   <div class="card" style="overflow:hidden">${[['Stuttgart', 'Germany', 1], ['Stuttgart-Vaihingen', 'Germany'], ['Stuttgart', 'Arkansas, US']].map((c, i) => `<button class="row" style="width:100%;padding:14px 16px;${i ? 'border-top:1px solid var(--line);' : ''}text-align:left" data-city>${I('MapPin', 18)}<span style="flex:1"><b style="font-weight:600">${c[0]}</b><span style="color:var(--mute)">, ${c[1]}</span></span>${c[2] ? `<span style="color:var(--pt)">${I('Check', 18, 2.6)}</span>` : ''}</button>`).join('')}</div>`, cta: 'Continue' }) },

friends: { label: 'Find your people', tag: 'new', setup: 1, skip: 1, render: () => setupScr({
  ill: `<div style="position:absolute;left:24px;top:30px;display:flex">${['marie', 'jonas', 'timo', 'nina'].map((a, i) => `<img class="av pop" src="${A('av_' + a + '.jpg')}" alt="" width="76" height="76" style="border:4px solid var(--bg);margin-left:${i ? -20 : 0}px;animation-delay:${200 + i * 130}ms">`).join('')}</div>` + st('plus1', 70, 270, 30, 10, 800),
  title: 'Find your *people.*', desc: 'Plans show up when your friends are here. Add people from Stuttgart and friends of friends.',
  body: `<div class="card" style="padding:14px 16px;background:var(--p);color:#fff;border:0"><div class="mono" style="opacity:.8">Your invite link</div><div class="row" style="margin-top:6px"><b style="flex:1;font-size:16px">i-am-in.app/u/marie</b><button class="icb" style="background:rgba(255,255,255,.2)" data-act="copy" aria-label="Copy link">${I('Copy', 18)}</button><button class="icb" style="background:#fff;color:#7C3BED" aria-label="Share link">${I('Share2', 18)}</button></div></div>
   <button class="card row" style="padding:14px 16px;text-align:left;width:100%">${I('BookUser', 22)}<span style="flex:1;font-weight:600">Find friends from contacts</span><span class="newtag">new</span></button>
   <div class="flab">Friends of friends · in Stuttgart</div>
   <div class="card" style="overflow:hidden">${[['nina', 'Lea Fontaine', '3 mutual friends · Jonas, Marie'], ['jonas', 'Ben Krüger', 'In Stuttgart · going to Razzia'], ['timo', 'Sam Okafor', '2 mutual friends · Timo'], ['marie', 'Ida Novak', 'New in Stuttgart']].map((p, i) => `<div class="row" style="padding:12px 14px;${i ? 'border-top:1px solid var(--line)' : ''}"><img class="av" src="${A('av_' + p[0] + '.jpg')}" alt="" width="42" height="42"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:15px">${p[1]}</div><div style="font-size:12.5px;color:var(--mute)">${p[2]}</div></div><button class="follow" aria-pressed="false" data-follow>Add</button></div>`).join('')}</div>`, cta: 'Continue' }) },

handles: { label: 'Settle-up handles', tag: 'old', setup: 1, skip: 1, render: () => setupScr({
  ill: st('receipt', 100, 30, 14, -10, 200) + st('cash', 92, 190, 36, 8, 420),
  title: 'Get paid back, *friction-free.*', desc: "Add your handles so friends can settle the tab in one tap. We'll prepend the @ for you.",
  body: `<div class="flab">PayPal</div><div class="field"><span class="pre">@</span><input placeholder="yourname"></div><div class="flab">Revolut</div><div class="field"><span class="pre">@</span><input placeholder="yourname"></div><div class="flab">N26 MoneyBeam</div><div class="field"><input placeholder="N26 MoneyBeam handle"></div>`, cta: 'Continue' }) },

notif: { label: 'Notifications', tag: 'new', setup: 1, render: () => setupScr({
  ill: st('in', 84, 4, 4, -10, 200),
  title: "Know who's *in.*", desc: "We'll tell you when friends join your plans, when a pact is on, and when your capsule opens.",
  body: `<div style="display:flex;flex-direction:column;gap:8px">${[['marie', 'Marie is in', 'Razzia · 4th anniversary', '2m'], ['jonas', 'Jonas made a pact', '“I\'ll go if you go.”', '1h'], ['nina', 'Your capsule opens', 'Razzia · 23 photos · 10:12', '3h']].map((n, i) => `<div class="notif slideR" style="animation-delay:${400 + i * 250}ms"><img class="av" src="${A('av_' + n[0] + '.jpg')}" alt="" width="42" height="42"><div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14.5px">${n[1]}</div><div style="font-size:13px;color:var(--mute)">${n[2]}</div></div><span style="font-size:12px;color:var(--mute);align-self:flex-start">${n[3]}</span></div>`).join('')}</div>`,
  cta: 'Turn on notifications', alt: 'Not now' }) },

done: { label: "You're in", tag: 'new', render: (st8) => `<div class="scr setup" style="align-items:center;text-align:center;justify-content:center">
  ${st('popper', 74, 30, 150, -10, 500)}${st(st8.path == 'organizer' ? 'ticket' : 'disco', 70, 286, 130, 10, 650)}${st('spark', 44, 40, 690, 0, 800)}${st('heart', 56, 300, 680, 8, 950)}
  <div class="pop" style="position:relative;animation-delay:150ms">${st8.path == 'organizer' ? `<div style="width:150px;height:150px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font:700 52px var(--ui)">${(st8.oname || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase()}</div><span style="position:absolute;right:-24px;top:-30px">${SV('crown', 64)}</span>` : st8.photo ? `<img class="av" src="${A('av_marie.jpg')}" alt="" width="150" height="150" style="border:4px solid var(--p);padding:4px;background:var(--bg)">` : `<div style="width:150px;height:150px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font:700 52px var(--ui)">${(st8.name || '?').trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase()}</div>`}${st8.mood ? `<span style="position:absolute;right:-26px;bottom:-14px">${SV(st8.mood, 64)}</span>` : ''}</div>
  <h2 class="hl" style="font-size:96px;margin-top:26px">${words("You're *in.*", 400)}</h2>
  <p class="sub" style="margin:12px 10px 0;--d:900ms">${st8.path == 'organizer' ? 'Your organizer profile is live. Create your first event and start your guest list.' : "Your feed is ready. Your friends' plans show up here first."}</p>
  <div style="position:absolute;left:20px;right:20px;bottom:calc(30px + env(safe-area-inset-bottom,0px))"><button class="btn p" data-act="restart">${st8.path == 'organizer' ? 'Create my first event' : 'Go to my feed'}</button></div>
</div>` },

oname: { label: 'Organizer name', tag: 'old', setup: 1, render: () => setupScr({
  ill: st('crown', 100, 30, 20, -10, 200) + st('ticket', 90, 180, 40, 8, 420),
  title: "What's your organizer *name?*", desc: 'The brand or venue name that appears on your events.',
  body: `<div class="field"><input id="ob-oname" placeholder="Your brand or venue"></div>`, cta: 'Continue', needs: 'ob-oname' }) },

ohandles: { label: 'Organizer web presence', tag: 'old', setup: 1, skip: 1, render: () => setupScr({
  ill: st('pin', 92, 30, 20, -8, 200) + st('envelope', 84, 190, 40, 8, 420),
  title: 'Where can people *find you?*', desc: 'Your Instagram and website show up on your organizer profile.',
  body: `<div class="flab">Instagram</div><div class="field"><span class="pre">@</span><input placeholder="yourbrand"></div><div class="flab">Website</div><div class="field">${I('Globe', 20)}<input placeholder="yourvenue.com"></div>`, cta: 'Continue' }) },

stripe: { label: 'Payout setup (Stripe Express)', tag: 'upd', setup: 1, skip: 1, render: () => setupScr({
  ill: st('ticket', 100, 30, 24, -10, 200) + st('cash', 90, 196, 30, 8, 420),
  title: 'Get paid out for *tickets.*', desc: 'Connect Stripe Express to sell tickets in the app and receive payouts to your bank account. Takes about 2 minutes.',
  body: `<div class="card" style="padding:16px;display:flex;flex-direction:column;gap:12px">${[['Ticket', 'Sell tickets on your event page'], ['Wallet', 'Payouts straight to your bank'], ['ListChecks', 'Buyers land on your guest list']].map((r) => `<div class="row" style="gap:12px"><span style="width:40px;height:40px;border-radius:12px;background:var(--pSoft);color:var(--pt);display:flex;align-items:center;justify-content:center">${I(r[0], 20)}</span><span style="font-weight:600;font-size:14.5px">${r[1]}</span></div>`).join('')}</div>`,
  cta: 'Connect Stripe Express', alt: 'Skip for now' }) },
};

const FLOWS = {
  person: ['splash', 'choose', 'p1', 'p2', 'p3', 'p4', 'getin', 'auth', 'name', 'birthday', 'city', 'handles', 'photo', 'friends', 'notif', 'done'],
  organizer: ['splash', 'choose', 'o1', 'o2', 'o3', 'o4', 'getin', 'auth', 'oname', 'ohandles', 'stripe', 'done'],
};
const STORY_MS = 5600;
const state = { path: 'person', i: 0, name: '', oname: '', mood: '', photo: false };
let timer = null;

function setupScr(o) {
  const flow = FLOWS[state.path]; const steps = flow.filter((k) => SCREENS[k].setup); const id = flow[state.i]; const si = steps.indexOf(id);
  return `<div class="scr setup">
    <div class="shead"><button class="icb" style="background:var(--s2)" data-act="back" aria-label="Back">${I('ChevronLeft', 20, 2.4)}</button><div class="steps">${steps.map((s, k) => `<span class="${k <= si ? 'done' : ''}"></span>`).join('')}</div>${SCREENS[id].skip ? '<button class="skip" data-act="next">Skip for now</button>' : '<span style="width:8px"></span>'}</div>
    <div class="ill">${o.ill || ''}</div>
    <h2 class="hl" style="font-size:44px;margin-top:6px">${words(o.title, 120)}</h2>
    <p class="sub" style="margin:10px 0 16px;--d:500ms">${o.desc}</p>
    <div class="sbody">${o.body}</div>
    <div style="display:flex;flex-direction:column;gap:4px;padding-top:10px">
      <button class="btn p" data-act="next" ${o.needs ? `data-needs="${o.needs}" disabled` : ''}>${o.cta}</button>
      ${o.alt ? `<button class="btn t" data-act="next">${o.alt}</button>` : ''}
    </div>
  </div>`;
}

const stage = document.getElementById('stage');
function storyIds() { return FLOWS[state.path].filter((k) => SCREENS[k].story); }
function render() {
  clearTimeout(timer); stage.classList.remove('paused');
  const id = FLOWS[state.path][state.i]; const s = SCREENS[id];
  let html = s.render(state);
  if (s.story) {
    const ids = storyIds(); const k = ids.indexOf(id); const dark = stage && (id === 'p2' || id === 'p3' || id === 'o3' || id === 'getin');
    const bars = `<div class="bars" style="color:${dark ? '#fff' : 'var(--ink)'}">${ids.map((x, j) => `<span class="${j < k ? 'done' : j == k ? (s.hold ? 'done' : 'on') : ''}"><i style="--dur:${STORY_MS}ms"></i></span>`).join('')}</div>`;
    const top = `<div class="topline" style="color:${dark ? '#fff' : 'var(--ink)'}">${logo}<button class="icb" data-act="skipstory" aria-label="Skip the story">${I('X', 22)}</button></div>`;
    html = html.replace(/^<div class="scr([^"]*)"([^>]*)>/, (m) => m + bars + top + (s.hold ? '' : '<div class="tapzone" data-tap></div>'));
  }
  stage.innerHTML = html;
  // story auto-advance when the active bar finishes
  const bar = stage.querySelector('.bars span.on i');
  if (bar) bar.addEventListener('animationend', () => go(1));
  if (s.auto) timer = setTimeout(() => go(1), s.auto);
  // live bits
  const cnt = stage.querySelector('[data-count]');
  if (cnt) { const to = +cnt.dataset.count; const t0 = performance.now() + 700; const tick = (t) => { const p = Math.min(1, Math.max(0, (t - t0) / 1400)); cnt.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString('en-US'); if (p < 1 && cnt.isConnected) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }
  const nm = stage.querySelector('#ob-name'); if (nm) { nm.value = state.name; syncNeeds(); nm.addEventListener('input', () => { state.name = nm.value; const ini = stage.querySelector('#initials'); if (ini) ini.textContent = (nm.value.trim().split(/\s+/).map((w) => w[0]).join('').slice(0, 2) || '?').toUpperCase(); syncNeeds(); }); }
  stage.querySelectorAll('input[id]').forEach((el) => el.addEventListener('input', syncNeeds));
  const on = stage.querySelector('#ob-oname'); if (on) { on.value = state.oname; syncNeeds(); on.addEventListener('input', () => { state.oname = on.value; }); }
  if (id === 'photo') paintAvatar();
  updatePanel();
}
function syncNeeds() { const b = stage.querySelector('[data-needs]'); if (b) { const el = stage.querySelector('#' + b.dataset.needs); b.disabled = !(el && el.value.trim()); } }
function paintAvatar() {
  const box = stage.querySelector('#avbox'); if (!box) return;
  box.innerHTML = (state.photo ? `<img class="av" src="${A('av_marie.jpg')}" alt="" width="140" height="140" style="width:140px;height:140px">` : I('Camera', 34, 1.8)) + (state.mood ? `<span class="stk" style="left:92px;top:78px;--r:8deg"><span>${SV(state.mood, 62)}</span></span>` : '');
  box.style.border = state.photo ? '0' : '';
  stage.querySelectorAll('[data-mood]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.mood === state.mood));
}
function go(d) { const n = FLOWS[state.path].length; state.i = Math.max(0, Math.min(n - 1, state.i + d)); render(); }
function goId(id) { const k = FLOWS[state.path].indexOf(id); if (k >= 0) { state.i = k; render(); } }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; stage.querySelector('.scr').appendChild(t); setTimeout(() => t.remove(), 2200); }

// taps, holds and buttons
let downAt = 0, held = false, holdT = null;
stage.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('[data-tap]')) return;
  downAt = performance.now(); held = false;
  holdT = setTimeout(() => { held = true; stage.classList.add('paused'); }, 220);
});
const release = (e) => {
  if (!downAt) return; clearTimeout(holdT); const wasHeld = held; downAt = 0;
  if (wasHeld) { stage.classList.remove('paused'); return; }
  const r = stage.getBoundingClientRect(); const x = e.clientX - r.left;
  go(x < r.width * 0.3 ? -1 : 1);
};
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', () => { clearTimeout(holdT); downAt = 0; stage.classList.remove('paused'); });
stage.addEventListener('click', (e) => {
  const pick = e.target.closest('[data-pick]');
  if (pick) { setPath(pick.dataset.pick, false); state.i = 2; render(); return; }
  const at = e.target.closest('[data-authtab]');
  if (at) { stage.querySelectorAll('[data-authtab]').forEach((b) => b.setAttribute('aria-pressed', b === at)); return; }
  const mood = e.target.closest('[data-mood]');
  if (mood) { state.mood = state.mood === mood.dataset.mood ? '' : mood.dataset.mood; paintAvatar(); return; }
  const f = e.target.closest('[data-follow]');
  if (f) { const on = f.getAttribute('aria-pressed') !== 'true'; f.setAttribute('aria-pressed', on); f.textContent = on ? 'Requested' : 'Add'; return; }
  if (e.target.closest('[data-city]')) { const c = stage.querySelector('#ob-city'); if (c) c.value = 'Stuttgart'; return; }
  const a = e.target.closest('[data-act]'); if (!a || a.disabled) return;
  const act = a.dataset.act;
  if (act === 'next') go(1);
  else if (act === 'back') go(-1);
  else if (act === 'skipstory') goId('getin');
  else if (act === 'restart') { state.i = 0; state.mood = ''; state.photo = false; state.name = ''; render(); }
  else if (act === 'login') toast('Opens sign-in (same as today).');
  else if (act === 'pickphoto') { state.photo = true; paintAvatar(); }
  else if (act === 'copy') { try { navigator.clipboard.writeText('https://i-am-in.app/u/marie').catch(() => {}); } catch (_) {} toast('Link copied'); }
  else if (act === 'stripe') toast('Stripe connection will be available shortly.');
  else if (act === 'forgot') toast('We sent you a password reset link.');
});
document.addEventListener('keydown', (e) => { if (e.target.closest('input')) return; if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });

// panel
const jump = document.getElementById('jump');
const TAGS = { new: ['new', 'New'], upd: ['upd', 'New look'], old: ['', 'Existing'] };
function updatePanel() {
  const flow = FLOWS[state.path];
  jump.innerHTML = flow.map((id, k) => { const s = SCREENS[id]; const t = TAGS[s.tag] || TAGS.old; return `<button data-j="${k}" aria-current="${k === state.i}"><span class="n">${String(k + 1).padStart(2, '0')}</span>${s.label}<span class="tag ${t[0]}">${t[1]}</span></button>`; }).join('');
  document.querySelectorAll('#pathSeg button').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === state.path));
}
jump.addEventListener('click', (e) => { const b = e.target.closest('[data-j]'); if (b) { state.i = +b.dataset.j; render(); } });
function setPath(p, rerender = true) { state.path = p; if (rerender) { state.i = Math.min(state.i, FLOWS[p].length - 1); render(); } }
document.getElementById('pathSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { state.i = 0; setPath(b.dataset.v); } });
document.getElementById('themeSeg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const v = b.dataset.v; if (v === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = v;
  document.querySelectorAll('#themeSeg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
});
document.getElementById('restart').addEventListener('click', () => { state.i = 0; state.mood = ''; state.photo = false; state.name = ''; render(); });
render();
})();
</script>
