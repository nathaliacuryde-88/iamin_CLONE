<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#D9D8D3;font-family:'Inter Tight',sans-serif;padding:40px}
.row{display:flex;gap:28px;align-items:flex-start;padding:28px;background:#D9D8D3;width:max-content}
.lbl{font:600 15px 'Inter Tight';color:#333;margin:0 0 -10px 28px}
.d{--bg:#0B0B0A;--s1:#171716;--s2:#242422;--ink:#F4F3EE;--mute:#8C8B85;--line:rgba(255,255,255,.08);--nav:#1A1A19;--navb:rgba(255,255,255,.08);--shadow:0 10px 30px rgba(0,0,0,.5)}
.l{--bg:#EEEDE8;--s1:#FFFFFF;--s2:#E4E3DD;--ink:#0B0B0A;--mute:#74736D;--line:rgba(0,0,0,.07);--nav:#0B0B0A;--navb:transparent;--shadow:0 10px 30px rgba(0,0,0,.10)}
.acc{--acc:#D8FF3D}
.ph{--acc:#D8FF3D;width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background:var(--bg);color:var(--ink);flex:none;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.abs{position:absolute}
.status{position:absolute;top:16px;left:34px;right:28px;display:flex;justify-content:space-between;font:600 16px 'Inter Tight';z-index:20}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.02em}
.anton{font-family:Anton,sans-serif;text-transform:uppercase;letter-spacing:.005em}
.wm{font:30px/1 Anton;display:flex;align-items:center;gap:6px}
.inpill{background:var(--acc);color:#0B0B0A;border-radius:999px;padding:3px 10px 2px;font-size:22px;line-height:1}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.circ{width:42px;height:42px;border-radius:50%;background:var(--s2);display:flex;align-items:center;justify-content:center}
.circ .ic{width:20px;height:20px}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;border:2px solid var(--s1);margin-left:-8px}
.av:first-child{margin-left:0}
.pill{height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 15px 'Inter Tight';padding:0 18px;white-space:nowrap}
.p-ghost{background:var(--s2);color:var(--ink)}
.p-acc{background:var(--acc);color:#0B0B0A}
.p-ink{background:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;height:30px;border:1.5px solid var(--line);border-color:color-mix(in srgb,var(--ink) 22%,transparent);border-radius:999px;padding:0 12px;font:500 12px 'JetBrains Mono';text-transform:uppercase}
.st{display:block;overflow:visible;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.nav{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;width:300px;height:64px;border-radius:999px;background:var(--nav);border:1px solid var(--navb);display:flex;align-items:center;justify-content:space-around;color:#8C8B85;z-index:15}
.nav .on{color:#F4F3EE;position:relative}
.nav .on:after{content:"";position:absolute;left:50%;bottom:-9px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
.nav .plus{width:48px;height:48px;border-radius:50%;background:var(--acc);color:#0B0B0A;display:flex;align-items:center;justify-content:center}
.fade{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(to bottom,transparent,var(--bg) 70%);z-index:14}
.card{position:absolute;left:16px;width:358px;background:var(--s1);border-radius:28px;border:1px solid var(--line);box-shadow:var(--shadow)}
.wtag{display:inline-block;font:22px/1 Anton;text-transform:uppercase;padding:7px 12px 6px;border:3px solid #fff;border-radius:8px;box-shadow:0 3px 6px rgba(0,0,0,.3)}
.panel{border-radius:36px;flex:none;position:relative;overflow:hidden}
.refs{display:grid;grid-template-columns:repeat(8,190px);gap:22px 18px;padding:34px;background:#F4F3EE;border-radius:36px}
.refs img{width:190px;height:250px;object-fit:cover;border-radius:14px;display:block;background:#ddd}
.refs p{font:500 13px/1.3 'Inter Tight';color:#222;margin-top:8px}
.refs b{font:600 11px 'JetBrains Mono';color:#888;display:block;margin-top:6px;text-transform:uppercase}
</style></head><body>

<!-- SVG library: icons + stickers -->
<svg width="0" height="0" style="position:absolute">
<defs>
 <radialGradient id="silver" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#c9c9c9"/><stop offset="1" stop-color="#5d5d5d"/></radialGradient>
 <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE38A"/><stop offset=".5" stop-color="#E9B23A"/><stop offset="1" stop-color="#B57E12"/></linearGradient>

 <!-- icons -->

 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>

 <symbol id="i-more" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18" cy="12" r="1.2"/></symbol>

 <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17L17 7M9 7h8v8"/></symbol>
 <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></symbol>
 <symbol id="i-dl" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 20h14"/></symbol>
 <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>

 <!-- stickers (die-cut: white outline painted under the fill) -->
 <symbol id="st-in" viewBox="0 0 100 100"><circle cx="50" cy="50" r="43" fill="#D8FF3D" stroke="#fff" stroke-width="6"/><text x="50" y="62" text-anchor="middle" font-family="Anton" font-size="33" fill="#0B0B0A" transform="rotate(-12 50 50)">I'M IN</text></symbol>
 <symbol id="st-disco" viewBox="0 0 100 100"><path d="M50 6v16" stroke="#fff" stroke-width="7" stroke-linecap="round"/><path d="M50 6v16" stroke="#9a9a9a" stroke-width="2.5"/><circle cx="50" cy="56" r="34" fill="url(#silver)" stroke="#fff" stroke-width="6"/><g clip-path="url(#discoclip)" stroke="rgba(0,0,0,.28)" stroke-width="1.6" fill="none"><path d="M10 34h80M10 43h80M10 52h80M10 61h80M10 70h80M10 79h80"/><ellipse cx="50" cy="56" rx="11" ry="34"/><ellipse cx="50" cy="56" rx="23" ry="34"/><path d="M50 20v74"/></g><rect x="30" y="37" width="8" height="7" fill="#fff" opacity=".9"/><rect x="40" y="46" width="6" height="6" fill="#fff" opacity=".6"/><path d="M78 20l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#fff"/></symbol>
 <symbol id="st-spritz" viewBox="0 0 100 100"><g stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><path d="M26 18h48c0 30-8 44-24 46C34 62 26 48 26 18z" fill="#E8F1F2"/><rect x="47" y="62" width="6" height="22" fill="#E8F1F2"/><ellipse cx="50" cy="86" rx="17" ry="5" fill="#E8F1F2"/><circle cx="72" cy="20" r="11" fill="#FFB21F"/></g><path d="M29 30h42c-2 20-9 30-21 31-12-1-19-11-21-31z" fill="#FF6A13"/><path d="M29 30h42" stroke="#FFD9B8" stroke-width="3"/><circle cx="72" cy="20" r="7.5" fill="#FFD36B"/><path d="M72 13v14M65 20h14M67 15l10 10M77 15l-10 10" stroke="#FFB21F" stroke-width="1.4"/><path d="M38 8l10 48" stroke="#0B0B0A" stroke-width="3" stroke-linecap="round"/><circle cx="41" cy="44" r="2" fill="#fff" opacity=".7"/><circle cx="56" cy="38" r="1.6" fill="#fff" opacity=".7"/></symbol>
 <symbol id="st-key" viewBox="0 0 100 100"><g transform="rotate(-32 50 50)" stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke" fill="url(#brass)"><path d="M14 50a20 20 0 1 1 40 0a20 20 0 1 1-40 0zM52 45h40v10h-8v10h-8v-10h-6v8h-8v-8H52z"/></g><g transform="rotate(-32 50 50)"><circle cx="27" cy="50" r="6" fill="#fff"/><path d="M58 50h30" stroke="#9c6a08" stroke-width="1.5"/></g></symbol>
 <symbol id="st-couch" viewBox="0 0 100 100"><g stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><rect x="22" y="28" width="56" height="30" rx="9" fill="#2F5BE6"/><rect x="16" y="50" width="68" height="22" rx="7" fill="#3B6CFF"/><rect x="8" y="40" width="18" height="36" rx="9" fill="#5A84FF"/><rect x="74" y="40" width="18" height="36" rx="9" fill="#5A84FF"/><rect x="16" y="76" width="7" height="10" rx="2" fill="#1b2f7a"/><rect x="77" y="76" width="7" height="10" rx="2" fill="#1b2f7a"/></g><path d="M50 52v18" stroke="#2848c4" stroke-width="2"/><rect x="30" y="34" width="16" height="13" rx="4" fill="#D8FF3D" transform="rotate(-8 38 40)"/></symbol>
 <symbol id="st-moon" viewBox="0 0 100 100"><path d="M60 12a38 38 0 1 0 28 58A30 30 0 1 1 60 12z" fill="#FFE14D" stroke="#fff" stroke-width="6" stroke-linejoin="round"/><circle cx="40" cy="62" r="4" fill="#F2C916"/><circle cx="30" cy="44" r="2.6" fill="#F2C916"/><path d="M80 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/></symbol>
 <symbol id="st-maybe" viewBox="0 0 100 100"><path d="M24 22h52a16 16 0 0 1 16 16v14a16 16 0 0 1-16 16H44l-16 14 3-14h-7A16 16 0 0 1 8 52V38a16 16 0 0 1 16-16z" fill="#fff" stroke="#fff" stroke-width="4" stroke-linejoin="round"/><text x="50" y="53" text-anchor="middle" font-family="Inter Tight" font-style="italic" font-weight="800" font-size="21" fill="#0B0B0A">maybe?</text></symbol>
 <symbol id="st-plus1" viewBox="0 0 100 100"><path d="M50 4l8 14 15-7 1 16 16 2-8 14 12 11-15 6 4 16-16-2-5 15-12-10-12 10-5-15-16 2 4-16-15-6 12-11-8-14 16-2 1-16 15 7z" fill="#FF5FA8" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><text x="50" y="64" text-anchor="middle" font-family="Anton" font-size="34" fill="#0B0B0A" transform="rotate(8 50 50)">+1</text></symbol>
 <symbol id="st-star" viewBox="0 0 100 100"><path d="M50 4l8 14 15-7 1 16 16 2-8 14 12 11-15 6 4 16-16-2-5 15-12-10-12 10-5-15-16 2 4-16-15-6 12-11-8-14 16-2 1-16 15 7z" fill="#FF5FA8" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></symbol>
 <symbol id="st-cam" viewBox="0 0 100 100"><g stroke="#fff" stroke-width="6" stroke-linejoin="round" paint-order="stroke"><rect x="10" y="28" width="80" height="48" rx="7" fill="#FFD400"/></g><rect x="10" y="28" width="80" height="13" rx="6" fill="#111"/><rect x="10" y="35" width="80" height="6" fill="#111"/><rect x="18" y="31" width="18" height="7" rx="2" fill="#EDEDED"/><rect x="72" y="31" width="11" height="7" rx="2" fill="#555"/><circle cx="58" cy="58" r="14" fill="#111"/><circle cx="58" cy="58" r="8" fill="#3a3a3a"/><circle cx="55" cy="55" r="2.6" fill="#bbb"/><text x="16" y="70" font-family="Anton" font-size="11" fill="#111">FLASH 27</text></symbol>
 <symbol id="st-receipt" viewBox="0 0 100 100"><g transform="rotate(6 50 50)"><path d="M24 8h52v80l-6.5-5-6.5 5-6.5-5-6.5 5-6.5-5-6.5 5-6.5-5-6.5 5z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M24 8h52v80l-6.5-5-6.5 5-6.5-5-6.5 5-6.5-5-6.5 5-6.5-5-6.5 5z" fill="#FBFAF5" stroke="#ddd" stroke-width="1"/><text x="50" y="22" text-anchor="middle" font-family="JetBrains Mono" font-size="7.5" fill="#111">THE NIGHT</text><path d="M31 32h26M31 40h20M31 48h24M31 56h16" stroke="#999" stroke-width="2.4"/><path d="M62 32h7M64 40h5M62 48h7M64 56h5" stroke="#999" stroke-width="2.4"/><path d="M31 64h38" stroke="#111" stroke-width="1" stroke-dasharray="2 2"/><text x="31" y="75" font-family="JetBrains Mono" font-size="8" font-weight="500" fill="#111">TOTAL</text><text x="69" y="75" text-anchor="end" font-family="Anton" font-size="11" fill="#111">9.1</text></g></symbol>
</defs></svg>

<div class="lbl">B · Dark (default) — feed keeps the card deck (swipe up/down = next event, left/right = Inner Circle ↔ City Pulse) and Maybe / I'm in under the flyer</div>
<div class="row" id="v2dark"></div>
<div class="lbl">B · Light — same system, flipped</div>
<div class="row" id="v2light"></div>
<div class="lbl">Stickers instead of emojis</div>
<div class="row" id="v2stickers"></div>
<div class="lbl">References — what we take</div>
<div class="row" id="v2refs"></div>

<script>
const I=(n,s=24,st='')=>`<svg class="ic" style="width:${s}px;height:${s}px;${st}"><use href="#i-${n}"/></svg>`;
const S=(n,s=60,r=0,st='')=>`<svg class="st" viewBox="0 0 100 100" style="width:${s}px;height:${s}px;transform:rotate(${r}deg);${st}"><use href="#st-${n}"/></svg>`;
const status=`<div class="status"><span>9:41</span><span style="display:flex;gap:6px;align-items:center"><svg width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5" width="3" height="7" rx="1" fill="currentColor"/><rect x="10" y="2" width="3" height="10" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg><svg width="27" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2.5" y="2.5" width="17" height="8" rx="2" fill="currentColor"/><rect x="25" y="4.5" width="2" height="4" rx="1" fill="currentColor" opacity=".4"/></svg></span></div>`;
const nav=(on)=>`<div class="fade"></div><div class="nav">${['feed','cal'].map(n=>`<span class="${on==n?'on':''}">${I(n)}</span>`).join('')}<span class="plus">${I('plus',24)}</span>${['cap','me'].map(n=>`<span class="${on==n?'on':''}">${I(n)}</span>`).join('')}</div>`;
const avs=(a,s=28)=>`<span style="display:flex">${a.map(x=>`<img class="av" style="width:${s}px;height:${s}px" src="a/av_${x}.jpg">`).join('')}</span>`;

function feed(t){
 const story=(img,name,mood,st,ring)=>`<div style="width:74px;text-align:center;flex:none"><div style="position:relative;width:64px;height:64px;margin:0 auto"><img src="a/av_${img}.jpg" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2.5px solid ${ring?'var(--acc)':'var(--s2)'};padding:2px;background:var(--bg)"><div class="abs" style="right:-10px;bottom:-6px">${S(st,32,-8)}</div></div><div style="font:600 13px 'Inter Tight';margin-top:8px">${name}</div><div class="mono" style="color:var(--mute);font-size:11px;margin-top:1px">${mood}</div></div>`;
 return `<div class="ph ${t}">${status}
 <div class="abs" style="top:58px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center"><div class="wm">I AM <span class="inpill">IN</span></div><div style="display:flex;gap:18px;align-items:center">${I('search')}<span style="position:relative">${I('bell')}<i style="position:absolute;right:1px;top:1px;width:8px;height:8px;border-radius:50%;background:#FF5FA8"></i></span><img src="a/av_nina.jpg" style="width:34px;height:34px;border-radius:50%;object-fit:cover"></div></div>
 <div class="abs" style="top:108px;left:20px;right:20px;display:flex;align-items:center;gap:22px;font:600 17px 'Inter Tight'"><span>Inner Circle</span><span style="color:var(--mute)">City Pulse</span><span style="flex:1"></span><span class="mono" style="color:var(--mute)">1 / 6</span>${I('filter',22,'color:var(--mute)')}</div>
 <div class="abs" style="top:150px;left:12px;display:flex;gap:4px">
   <div style="width:74px;text-align:center;flex:none"><div style="width:64px;height:64px;margin:0 auto;border-radius:50%;border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);display:flex;align-items:center;justify-content:center;color:var(--mute)">${I('plus')}</div><div style="font:600 13px 'Inter Tight';margin-top:8px">Your mood</div><div class="mono" style="color:var(--mute);font-size:11px;margin-top:1px">tonight?</div></div>
   ${story('jonas','Jonas','pre-drinks','spritz',1)}${story('timo','Timo','out out','disco',1)}${story('marie','Marie','at mine','key',1)}${story('nina','Nina','couch','couch',0)}
 </div>
 <div class="card" style="top:712px;left:34px;width:322px;opacity:.6;transform:scale(.96)"><div style="height:60px"></div></div>
 <div class="card" style="top:668px;left:24px;width:342px;z-index:2"><div style="display:flex;justify-content:space-between;padding:16px 18px;font:600 16px 'Inter Tight'"><span>Alles offen 26</span><span class="mono" style="color:var(--mute);font-size:13px">SAT 10 OCT</span></div></div>
 <div class="card" style="top:268px;height:416px;z-index:3">
   <div style="display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 12px"><span style="font:600 17px 'Inter Tight'">Razzia · 4th anniversary</span><span class="mono" style="color:var(--mute);font-size:13px">TONIGHT</span></div>
   <div style="margin:0 12px;height:290px;border-radius:20px;overflow:hidden;position:relative;background:#000"><img src="a/fl_razzia_clean.png" style="width:100%;height:100%;object-fit:cover;object-position:50% 35%"><span class="abs" style="left:10px;bottom:10px;height:30px;border-radius:999px;padding:0 12px 0 8px;display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);color:#fff;font:500 13px 'Inter Tight'">${I('pin',16)}Romantica</span></div>
   <div style="display:flex;align-items:center;padding:12px 12px 0 18px;gap:8px">${avs(['marie','timo','jonas'])}<span class="mono" style="color:var(--mute);margin-left:4px">+4</span><span style="flex:1"></span><span class="pill p-ghost" style="height:40px;padding:0 16px">Maybe</span><span class="pill p-acc" style="height:40px;padding:0 16px">${I('check',18)}I'm in</span></div>
 </div>
 ${nav('feed')}</div>`;
}

function event(t){
 return `<div class="ph ${t}">${status}
 <div class="abs" style="top:56px;left:20px;right:20px;display:flex;justify-content:space-between"><span class="circ">${I('back')}</span><span style="display:flex;gap:10px"><span class="circ">${I('share')}</span><span class="circ">${I('more')}</span></span></div>
 <div class="abs" style="top:112px;left:24px;width:342px;height:330px;border-radius:24px;overflow:hidden;box-shadow:var(--shadow);background:#000"><img src="a/fl_razzia_clean.png" style="width:100%;height:100%;object-fit:cover;object-position:50% 40%"></div>
